# Worktrees land inside the repo, out of the way
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[aliases]
# Supacode locks the worktrees it manages, so `wt remove` refuses to delete
# them (even with --force). This unlocks first, then removes, in one step.
# All wt remove flags pass through, e.g. `wt rmu -D` or `wt rmu mybranch -D`.
rmu = '''
target=""
for a in {{ args }}; do
  case "$a" in
    -*) : ;;
    *) target="$a" ;;
  esac
done
want="${target:-$(git branch --show-current)}"
path=$(git worktree list --porcelain | awk -v want="$want" '
  /^worktree /{p=$2}
  /^branch refs\/heads\//{b=$0; sub(/^branch refs\/heads\//,"",b)}
  /^$/{if (p==want || b==want) print p; p=""; b=""}
  END{if (p==want || b==want) print p}
')
[ -n "$path" ] && git worktree unlock "$path" 2>/dev/null
wt remove {{ args }}
'''

[commit]
# Stage all changes before generating a commit message
stage = "all"

[commit.generation]
# Use Claude (haiku for speed) to generate commit messages from the diff
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
template-append = """
- Use conventional commit format: type(scope): subject
- Reference a ticket ID in the body if the branch name contains one (e.g. ENG-1234)
- Imperative mood: "Add feature" not "Added feature"
"""

[merge]
squash = true
commit = true
remove = true

[post-start]
# Share gitignored files (e.g. .claude/settings.local.json) into new worktrees
copy-ignored = "wt step copy-ignored"

[projects."github.com/Hinge-Select/hinge-select"]
# Bazel keeps per-worktree caches alive after removal, causing memory growth
# (see #hingeselect-eng thread). Expunge before the worktree is deleted.
pre-remove = "bazel clean --expunge_async"
